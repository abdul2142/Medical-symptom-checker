[project]
name = "carecheck"
version = "2.0.0"
description = "Educational symptom-triage and medicine-reference prototype"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# The app modules live at the project root, so put it on sys.path. Without
# this, `pytest` only works when invoked as `python -m pytest` from this exact
# directory, and fails in CI and in IDE test runners.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # long lines are tolerated in the medical data tables
    "B008",
]
